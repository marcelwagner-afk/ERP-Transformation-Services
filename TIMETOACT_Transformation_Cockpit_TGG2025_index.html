  <style>
    /* =====================================================
       TIMETOACT GROUP Corporate Design TGG 2025
       Extracted from official presentation
       ===================================================== */
    :root {
      /* Primary Colors */
      --tta-dark: #0A1A29;           /* Hauptfarbe Dunkelblau */
      --tta-white: #FFFFFF;
      --tta-gray-light: #F2F2F2;
      
      /* Accent Colors */
      --tta-blue-light: #7CC2FA;     /* Accent 1 - Hellblau */
      --tta-orange: #DA5500;         /* Accent 2 - Orange (We Care, We Drive, We Deliver) */
      --tta-teal: #098F9B;           /* Accent 3 - Türkis */
      --tta-blue: #205EA7;           /* Accent 4 - Blau */
      --tta-teal-dark: #006B76;      /* Accent 5 - Dunkel-Türkis */
      --tta-blue-dark: #064A80;      /* Accent 6 - Dunkelblau */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      background: var(--tta-dark);
      color: var(--tta-white);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease-out; }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: 'Segoe UI Semibold', 'Segoe UI', Arial, sans-serif;
      font-weight: 600;
    }

    /* Container */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    /* ============================================
       HEADER
       ============================================ */
    .header {
      padding: 30px 20px 20px;
      text-align: center;
    }

    .logo-container {
      margin-bottom: 20px;
    }

    .logo-text {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--tta-white);
      opacity: 0.7;
      margin-bottom: 4px;
    }

    .logo-main {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--tta-white);
    }

    .logo-main span {
      color: var(--tta-orange);
    }

    .tagline {
      margin-top: 16px;
      font-size: 13px;
      color: var(--tta-white);
      opacity: 0.9;
    }

    .tagline-highlight {
      display: inline-block;
      margin-top: 8px;
    }

    .tagline-highlight span {
      font-weight: 600;
      margin: 0 4px;
    }

    .tagline-highlight .care { color: var(--tta-orange); }
    .tagline-highlight .drive { color: var(--tta-orange); }
    .tagline-highlight .deliver { color: var(--tta-orange); }

    /* ============================================
       MAIN CARD
       ============================================ */
    .main-card {
      background: var(--tta-white);
      border-radius: 16px;
      padding: 24px;
      margin: 20px auto;
      max-width: 700px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--tta-dark);
      text-align: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--tta-gray-light);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--tta-dark);
      margin: 20px 0 12px;
      padding-top: 16px;
      border-top: 2px solid var(--tta-gray-light);
    }

    /* ============================================
       NAVIGATION BUTTONS
       ============================================ */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .nav-button {
      background: var(--tta-dark);
      border: none;
      border-radius: 10px;
      padding: 14px 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .nav-button:hover {
      background: var(--tta-blue-dark);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(10, 26, 41, 0.4);
    }

    .nav-button:active {
      transform: scale(0.98);
    }

    .nav-button-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--tta-white);
      margin-bottom: 4px;
    }

    .nav-button-subtitle {
      font-size: 9px;
      color: var(--tta-blue-light);
      opacity: 0.8;
    }

    .nav-button-cta {
      font-size: 9px;
      color: var(--tta-orange);
      margin-top: 6px;
      font-weight: 600;
    }

    /* ============================================
       TOPIC GRID
       ============================================ */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    @media (min-width: 500px) {
      .topic-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 700px) {
      .topic-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .topic-button {
      background: rgba(124, 194, 250, 0.1);
      border: 1px solid rgba(124, 194, 250, 0.3);
      border-left: 3px solid var(--tta-teal);
      border-radius: 8px;
      padding: 12px 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      font-size: 11px;
      font-weight: 500;
      color: var(--tta-white);
    }

    .topic-button:hover {
      background: rgba(124, 194, 250, 0.2);
      border-color: var(--tta-blue-light);
      transform: translateX(3px);
    }

    .topic-button:active {
      transform: scale(0.98);
    }

    /* ============================================
       PAGE CONTENT
       ============================================ */
    .page-content {
      background: var(--tta-dark);
      min-height: 100vh;
      padding: 20px;
    }

    .page-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .page-header {
      background: linear-gradient(135deg, var(--tta-teal) 0%, var(--tta-teal-dark) 100%);
      color: var(--tta-white);
      padding: 20px 24px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .page-header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    /* ============================================
       BACK BUTTON (Orange)
       ============================================ */
    .back-button {
      background: var(--tta-orange);
      color: var(--tta-white);
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 16px;
    }

    .back-button:hover {
      background: #C44D00;
      transform: translateY(-1px);
    }

    .back-button:active {
      transform: scale(0.98);
    }

    /* ============================================
       DETAIL VIEW
       ============================================ */
    .detail-card {
      background: var(--tta-white);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }

    .detail-header {
      font-size: 20px;
      font-weight: 600;
      color: var(--tta-dark);
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 3px solid var(--tta-teal);
    }

    .detail-label {
      font-size: 11px;
      color: var(--tta-teal);
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-text {
      font-size: 14px;
      line-height: 1.7;
      color: var(--tta-dark);
      white-space: pre-line;
    }

    /* ============================================
       BREADCRUMB
       ============================================ */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
    }

    .breadcrumb-link {
      color: var(--tta-blue-light);
      cursor: pointer;
      text-decoration: underline;
    }

    .breadcrumb-link:hover {
      color: var(--tta-white);
    }

    /* ============================================
       FOOTER
       ============================================ */
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
    }

    .footer-tagline {
      color: var(--tta-white);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .footer-tagline span {
      color: var(--tta-orange);
      font-weight: 600;
    }

    /* ============================================
       CHRISTMAS BANNER
       ============================================ */
    .christmas-banner {
      background: linear-gradient(90deg, var(--tta-teal-dark) 0%, var(--tta-teal) 50%, var(--tta-teal-dark) 100%);
      color: var(--tta-white);
      text-align: center;
      padding: 10px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
